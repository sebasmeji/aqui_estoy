<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/styles/nuevo_usuario.css">
    <link rel="stylesheet" href="/frontend/styles/mensajes.css">
</head>

<body>
    <div class="login">

        <div class="form-container">
            <h1 class="title">Nuevo Usuario</h1>

            <form id="form-nuevo-usuario" class="form">
                <input type="text" id="name" placeholder="Nombre" class="input input-name" maxlength="80" required>

                <input type="text" id="last-name" placeholder="Apellido" class="input input-last-name" maxlength="80" required>

                <input type="email" id="email" placeholder="Correo" class="input input-email" required>

                <input type="password" id="password" placeholder="Contraseña (mínimo 8 caracteres)" class="input input-password" minlength="8" required>

                <input type="password" id="confirm-password" placeholder="Confirmar Contraseña" class="input input-confirm-password" minlength="8" required>

                <p id="mensaje" class="mensaje" role="alert"></p>

                <input type="submit" value="Crear cuenta" class="create-button primary-button">
            </form>
        </div>
    </div>

    <script src="/frontend/js/nuevo_usuario.js"></script>
</body>

</html>
