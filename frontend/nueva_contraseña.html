<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña</title>
    <link rel="icon" href="/imagenes/logos/favicon_yard_sale.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/frontend/styles/nueva_contraseña.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contenedor_login">
        <div class="form-container">
            <img src="/imagenes/logos/logo_yard_sale.svg" alt="Logo principal" class="logo">
            <h1 class="title">Crea tu nueva contraseña</h1>
            <p>Ingresa una nueva contraseña para tu cuenta</p>

            <form action="/" class="form">
                <label for="password" class="label">Nueva Contraseña</label>
                <input type="password" id="password" placeholder="*********" class="input input-password" required>

                <label for="newPassword" class="label">Confirmar Contraseña</label>
                <input type="password" id="newPassword" placeholder="*********" class="input input-newPassword"
                    required>

                <input type="submit" value="Confirm" class="primary-button login-button">
            </form>
        </div>
    </div>
</body>
</html>
